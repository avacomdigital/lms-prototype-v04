<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Fondo del icono de AVACOM OPS Master: una placa blanca, sin nada mas.

  El simbolo va en appiconfg.svg, que el .csproj compone encima como
  ForegroundFile. Blanco y no el rojo de marca porque el simbolo de AVACOM es
  multicolor y su trazo rojo desapareceria sobre un fondo rojo.

  Antes habia aqui el cuadrado morado #512BD4 que trae la plantilla de .NET
  MAUI: era el logotipo de Microsoft, no el de la empresa.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <rect x="0" y="0" width="456" height="456" fill="#FFFFFF"/>
</svg>
